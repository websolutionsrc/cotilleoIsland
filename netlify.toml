[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: no client-side router today, but this keeps a direct deep
# link (e.g. a shared /some-path) from 404ing instead of loading the app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    # Service worker must always be revalidated so updates roll out promptly
    # (vite-plugin-pwa's registerType: "autoUpdate" relies on this).
    Cache-Control = "no-cache"
